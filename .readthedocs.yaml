# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # The docs build from uv.lock with only the `docs` dependency group. The
  # package itself is not installed: mkdocstrings reads the source statically.
  commands:
    - python -m pip install uv
    - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --frozen --only-group docs --inexact
    - python -m mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
