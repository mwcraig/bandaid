name: Update photutils pin

# bandaid pins photutils to a nightly wheel from astropy's anaconda.org channel,
# which keeps only its 10 newest nightlies, so a stale `==` pin stops resolving
# after roughly 10 publishes. This workflow moves the pin to the newest nightly
# once a week and opens a PR, but only if the test suite passes on it. The
# suite runs here because a PR opened by a workflow does not trigger the CI
# workflow.
#
# The jobs that install and run the (unreviewed) nightly hold a read-only token
# and never persist it into the checkout; only the final job, which runs no
# third-party code, can write to the repository.

on:
  schedule:
    # Mondays 08:00 UTC, a few hours after the 04:30 UTC nightly publish.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    name: relock to the newest nightly
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
      old_version: ${{ steps.pin.outputs.old_version }}
      new_version: ${{ steps.pin.outputs.new_version }}
      old_sha: ${{ steps.pin.outputs.old_sha }}
      new_sha: ${{ steps.pin.outputs.new_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Loosen the photutils pin
        id: unpin
        run: python3 .github/scripts/update_photutils_pin.py unpin
      - name: Upgrade photutils in the lock file
        run: uv lock --upgrade-package photutils
      - name: Pin photutils to the locked version
        id: pin
        run: >-
          python3 .github/scripts/update_photutils_pin.py pin
          --old-version "${{ steps.unpin.outputs.old_version }}"
      - name: Re-lock after pinning
        run: uv lock
      - name: Save the relocked files
        uses: actions/upload-artifact@v7
        with:
          name: relocked-files
          path: |
            pyproject.toml
            uv.lock

  tests:
    name: tests on the newest nightly (Python ${{ matrix.python-version }})
    needs: relock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the relocked files
        uses: actions/download-artifact@v8
        with:
          name: relocked-files
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group tests --python ${{ matrix.python-version }}
      - name: Show installed photutils version
        run: uv run python -c "import photutils; print(photutils.__version__)"
      - name: Run pytest
        run: uv run pytest

  pull-request:
    name: open the pin-update PR
    needs: [relock, tests]
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the relocked files
        uses: actions/download-artifact@v8
        with:
          name: relocked-files
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-photutils-pin
          delete-branch: true
          add-paths: |
            pyproject.toml
            uv.lock
          commit-message: Bump photutils nightly pin to ${{ needs.relock.outputs.new_version }}
          title: Bump photutils nightly pin to ${{ needs.relock.outputs.new_version }}
          body: |
            Moves the photutils nightly pin from `${{ needs.relock.outputs.old_version }}` to `${{ needs.relock.outputs.new_version }}`.

            photutils changes: https://github.com/astropy/photutils/compare/${{ needs.relock.outputs.old_sha }}...${{ needs.relock.outputs.new_sha }}

            The test suite passed on the new nightly on Python 3.12 and 3.13 in the [workflow run that opened this PR](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
